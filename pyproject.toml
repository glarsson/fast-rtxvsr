[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-rtxvsr"
version = "1.0.0"
description = "Standalone NVIDIA RTX Video Super Resolution CLI - GPU decode -> VSR -> encode in one pass, no ComfyUI server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "av>=9.0",
    "numpy>=1.21",
    "pillow>=9.0",
]

[project.scripts]
fast-rtxvsr = "fast_rtxvsr.cli:main"

[tool.setuptools.packages.find]
include = ["fast_rtxvsr*"]
